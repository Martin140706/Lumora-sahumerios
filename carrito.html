<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Carrito | Lumora</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>MI CARRITO</h1>

      <p>Revisá tu pedido antes de enviarlo.</p>
    </header>

    <main>
      <section>
        <div id="carrito"></div>

        <div class="resumen-carrito">
          <p>
            Total:
            <strong> $<span id="total-carrito">0</span> </strong>
          </p>

          <div class="acciones-carrito">
            <button id="vaciar-carrito">🗑 Vaciar carrito</button>

            <button id="whatsapp">Enviar pedido por WhatsApp</button>
          </div>
        </div>

        <!-- CONFIRMACIÓN -->

        <div id="modal-vaciar" class="modal">
          <div class="modal-contenido">
            <h2>¿Vaciar el carrito?</h2>

            <p>Se eliminarán todos los productos de tu pedido.</p>

            <div class="modal-botones">
              <button id="cancelar-vaciar">Cancelar</button>

              <button id="confirmar-vaciar">Vaciar</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <a href="index.html">← Volver a Lumora</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
